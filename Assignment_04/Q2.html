<!DOCTYPE html>
<head>
  <title>Responsive Bootstrap Grid Layout</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
  <div class="container">
     <div class="row">
      <div class="col bg-success text-white">Column 1</div>
      <div class="col bg-primary text-dark">Column 2</div>
    </div>
    
     <div class="row">
      <div class="col bg-primary text-white">Column 1</div>
      <div class="col bg-success text-dark">Column 2</div>
      <div class="col bg-primary text-white">Column 3</div>
    </div>
    
     <div class="row">
      <div class="col col-sm-3 bg-success text-dark">Column 1</div>
      <div class="col col-sm-3 bg-primary text-white">Column 2</div>
      <div class="col col-sm-3 bg-success text-dark">Column 3</div>
      <div class="col col-sm-3 bg-primary text-white">Column 4</div>
    </div>
    
     <div class="row">
      <div class="col col-md-2 bg-primary text-white">Column 1</div>
      <div class="col col-md-2 bg-success text-dark">Column 2</div>
      <div class="col col-md-2 bg-primary text-white">Column 3</div>
      <div class="col col-md-2 bg-success text-dark">Column 4</div>
      <div class="col col-md-2 bg-primary text-white">Column 5</div>
      <div class="col col-md-2 bg-success text-dark">Column 6</div>
    </div>
  </div>

 </body>
</html>
