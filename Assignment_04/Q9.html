<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Year Card Gallery</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-4">
        <h1 class="text-center mb-4">New Year Card Gallery</h1>
        <div class="row g-4">
   
            <div class="col-md-4">
                <div class="card h-100 shadow-lg">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQpcKchQ9urf0KDTSkM3JGmMfaUqOiStNd5nA&s" class="card-img-top" alt="New Year Celebration">
                    <div class="card-body">
                        <h5 class="card-title">Celebrate the New Year</h5>
                        <p class="card-text">Wishing you joy, peace, and success in the coming year!</p>
                        <a href="#" class="btn btn-primary text-center">Learn More</a>
                    </div>
                </div>
            </div>
      
            <div class="col-md-4">
                <div class="card h-100 shadow-lg">
                    <img src="https://www.shutterstock.com/image-illustration/happy-new-year-2025-greeting-260nw-761207101.jpg" class="card-img-top" alt="New Year Wishes">
                    <div class="card-body">
                        <h5 class="card-title">New Beginnings</h5>
                        <p class="card-text">May your year be filled with endless possibilities and happiness.</p>
                        <a href="#" class="btn btn-success">Explore More</a>
                    </div>
                </div>
            </div>
             

 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
