<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Group Achievements</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
 
  <nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Focus Group</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="#">Admission</a>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="achievementDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              Achievements
            </a>
            <ul class="dropdown-menu" aria-labelledby="achievementDropdown">
              <li><a class="dropdown-item" href="">Gallery</a></li>
              <li><a class="dropdown-item" href="#">Other Achievements</a></li>
            </ul>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Alumni</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

 
  <div id="gallerySection" class="container mt-5">
    <h2 class="text-center">Achievements Gallery</h2>
    <div id="achievementCarousel" class="carousel slide" data-bs-ride="carousel">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="https://img.freepik.com/premium-photo/face-young-handsome-bearded-man_251136-35800.jpg?semt=ais_hybrid"  height="300px" width="600px" alt="Achievement 1">
          <div class="carousel-caption d-none d-md-block">
            <h5>Achievement 1</h5>
            <p>Description of Achievement 1</p>
          </div>
        </div>
        <div class="carousel-item">
          <img src="https://via.placeholder.com/800x400?text=Achievement+2"  alt="Achievement 2">
          <div class="carousel-caption d-none d-md-block">
            <h5>Achievement 2</h5>
            <p>Description of Achievement 2</p>
          </div>
        </div>
        <div class="carousel-item">
          <img src="https://via.placeholder.com/800x400?text=Achievement+3" class="d-block w-100" alt="Achievement 3">
          <div class="carousel-caption d-none d-md-block">
            <h5>Achievement 3</h5>
            <p>Description of Achievement 3</p>
          </div>
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#achievementCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#achievementCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>
    </div>
  </div>

 
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
