<!DOCTYPE html>
<head>
  <title>Responsive Bootstrap Grid Layout</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    .row {
      border: 1px solid #000;
      background-color: lightgreen;
      margin-bottom: 10px;
    }
    .col {
      border: 1px solid #000;
      text-align: center;
      padding: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
     <div class="row">
        <div class="col">Column 1</div>
      <div class="col">Column 2</div>
    </div>
    
     <div class="row">
      <div class="col">Column 1</div>
      <div class="col">Column 2</div>
      <div class="col">Column 3</div>
    </div>
    
     <div class="row">
      <div class="col col-sm-3">Column 1</div>
      <div class="col col-sm-3">Column 2</div>
      <div class="col col-sm-3">Column 3</div>
      <div class="col col-sm-3">Column 4</div>
    </div>
    
     <div class="row">
      <div class="col col-md-2">Column 1</div>
      <div class="col col-md-2">Column 2</div>
      <div class="col col-md-2">Column 3</div>
      <div class="col col-md-2">Column 4</div>
      <div class="col col-md-2">Column 5</div>
      <div class="col col-md-2">Column 6</div>
    </div>
  </div>

 </body>
</html>
