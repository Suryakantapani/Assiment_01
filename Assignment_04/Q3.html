<!DOCTYPE html> 
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .thumbnail {
      width: 200px;
      height: 200px;
      border: 2px dotted black;
    }
     
  </style>
</head>
<body>
  <div class="container text-center my-5">
    <div class="row">
      <div class="col">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTIET-_LD1gZb1filOIp1tdx50vnMeqGgaPpA&s" class="thumbnail" alt="Thumbnail 1">
      </div>
      <div class="col">
        <img src="https://meds.myupchar.com/101397/rapiclav-625-tablet-1.webp" class="thumbnail" alt="Thumbnail 2">
      </div>
      <div class="col">
        <img src="https://www.onebharatpharmacy.com/uploads/product/main/1622645011_1844_0.jpg" class="thumbnail"   alt="Thumbnail 3">
      </div>
    </div>
    <button class="btn btn-primary mt-4" id="makeCircularBtn">Make Images Circular</button>
  </div>
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    $(document).ready(function() {
      $('#makeCircularBtn').click(function() {
        $('.thumbnail').addClass('rounded-circle');
      });
    });
  </script>
</body>
</html>
