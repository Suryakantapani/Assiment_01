<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information with Search</title>
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <style>
         .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background-color: #ffffff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        .btn-edit {
            background-color: #28a745;
            padding: 5px 10px;
        }
        .btn-edit:hover {
            background-color: #218838;
        }
        .btn-delete {
            background-color: #dc3545;
            padding: 5px 10px;
            border-radius: 5px;
        }
        .btn-delete:hover {
            background-color: #c82333;
        }
        .search-bar {
            margin-bottom: 15px;
            text-align: center;
        }
        .search-bar input {
            width: 50%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        } 
    </style>
</head>
<body>
    <div class="container">
        <h1>Student Information</h1>
        <div class="search-bar">
            <input type="text" id="searchBar" placeholder="Search students by name...">
        </div>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Semester</th>
                    <th>Registration Number</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="studentTable">
                <tr>
                    <td>John Doe</td>
                    <td>20</td>
                    <td>3</td>
                    <td>2023001</td>
                    <td>
                        <button class="btn-edit">Edit</button>
                        <button class="btn-delete">Delete</button>
                    </td>
                </tr>
                <tr>
                    <td>Jane Smith</td>
                    <td>22</td>
                    <td>5</td>
                    <td>2023002</td>
                    <td>
                        <button class="btn-edit">Edit</button>
                        <button class="btn-delete">Delete</button>
                    </td>
                </tr> 
            </tbody>
        </table>
    </div>

    <script>
        $(document).ready(function () {
            $('#searchBar').on('keyup', function () {
                const query = $(this).val().toLowerCase();
                $('#studentTable tr').filter(function () {
                    $(this).toggle($(this).find('td:first-child').text().toLowerCase().indexOf(query) > -1);
                });
            });

           
            $(document).on('click', '.btn-delete', function () {
                $(this).closest('tr').remove();
            });
 
            $(document).on('click', '.btn-edit', function () {
                const $row = $(this).closest('tr');
                const $cells = $row.find('td').not(':last-child');

                if ($(this).text() === 'Edit') {
     
                    $cells.each(function () {
                        const text = $(this).text();
                        $(this).html(`<input type="text" value="${text}" class="form-control" />`);
                    });
 
                    $(this).text('Save').removeClass('btn-edit').addClass('btn-save');
                } else {
 
                    $cells.each(function () {
                        const value = $(this).find('input').val();
                        $(this).text(value);
                    });

 
                    $(this).text('Edit').removeClass('btn-save').addClass('btn-edit');
                }
            });
        });
    </script>
</body>
</html>
